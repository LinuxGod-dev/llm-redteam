[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Automated red-team harness for LLM apps and agents, mapped to OWASP LLM Top 10 and MITRE ATLAS"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llmredteam = "llmredteam.cli:main"

[tool.setuptools]
packages = ["llmredteam", "llmredteam.targets"]

[tool.setuptools.package-data]
llmredteam = ["attacks/*.yaml"]
